{% extends "base.html" %}

{% block title %}Conditional Preventive Maintenance Report{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
<style>
    :root {
        --color-primary: #185fa5;
        --color-success: #2d8a4e;
        --color-danger: #c0392b;
        --color-warning: #BA7517;
        --color-neutral: #888780;
        --color-text-primary: #2c3e50;
        --color-text-secondary: #7f8c8d;
        --color-border: #ecf0f1;
        --color-bg: #f8f9fa;
    }

    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--color-bg);
    }
</style>
{% endblock %}

{% block content %}
<div id="react-root"></div>

<!-- Pass pre-selected data to window for React component -->
{% if machine %}
<script>
    window.__conditionalReport = {
        technicianName: "{{ current_user.full_name if current_user else 'Technicien' }}",
        machineName: "{{ machine.name if machine else '' }}",
        zone: "{{ machine.zone if machine and machine.zone else '' }}"
    };
</script>
{% endif %}

<!-- React, ReactDOM and Babel from CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Load and execute the React component -->
<script type="text/babel" src="{{ url_for('static', filename='js/ConditionalMaintenanceReport.jsx') }}"></script>

<script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('react-root'));
    root.render(<ConditionalMaintenanceReport />);
</script>
{% endblock %}
